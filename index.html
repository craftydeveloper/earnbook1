<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeatherNow — local forecast</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#081522;color:#edf6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#174d70,#081522 45%);min-height:100vh}.wrap{max-width:960px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:800;font-size:1.25rem;letter-spacing:.03em}.badge{font-size:.8rem;color:#96c8e5}.panel{margin-top:28px;padding:24px;border:1px solid #28516a;border-radius:22px;background:#102536dd;box-shadow:0 20px 60px #0004}.search{display:flex;gap:10px}.search input{flex:1;min-width:0;background:#081a28;color:white;border:1px solid #31556c;border-radius:12px;padding:14px;font:inherit}.search button{border:0;border-radius:12px;padding:0 20px;background:#70d6c5;color:#05221f;font:700 1rem system-ui;cursor:pointer}.search button:disabled{opacity:.6}.status{min-height:24px;color:#abd0e4;margin:14px 0 0}.current{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px}.place{font-size:1.15rem;font-weight:700}.temp{font-size:clamp(3rem,9vw,5rem);font-weight:750;line-height:1}.summary{color:#a9c9dc}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.day{background:#0a1c2b;border:1px solid #25475c;border-radius:14px;padding:14px 10px;text-align:center}.day b,.day span{display:block}.day span{color:#9dbbcd;font-size:.9rem;margin-top:5px}.error{color:#ffb3a8}@media(max-width:620px){.wrap{padding:22px 14px}.forecast{grid-template-columns:repeat(2,1fr)}.search button{padding:0 14px}.current{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">WeatherNow</div><div class="badge">Live forecast · Open-Meteo</div></header><section class="panel"><h1>Weather, where you are.</h1><p class="summary">Search a city for current conditions and a five-day outlook.</p><form id="form" class="search"><input id="city" placeholder="City or town" aria-label="City or town" required><button id="go">Search</button></form><p id="status" class="status" role="status"></p><div id="result" hidden><div class="current"><div><div class="place" id="place"></div><div class="summary" id="desc"></div></div><div class="temp" id="temp"></div></div><div id="days" class="forecast"></div></div></section></main><script>
const form=document.getElementById('form'),input=document.getElementById('city'),statusEl=document.getElementById('status'),button=document.getElementById('go');const codes={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorm'};input.value=localStorage.getItem('weathernow-city')||'';
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;button.disabled=true;statusEl.className='status';statusEl.textContent='Finding location and forecast…';document.getElementById('result').hidden=true;try{const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=en&format=json');if(!geo.ok)throw new Error('Location search failed. Try again.');const g=(await geo.json()).results?.[0];if(!g)throw new Error('No matching place found. Try another city.');const url='https://api.open-meteo.com/v1/forecast?latitude='+g.latitude+'&longitude='+g.longitude+'&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5';const fr=await fetch(url);if(!fr.ok)throw new Error('Forecast service is unavailable right now.');const d=await fr.json();document.getElementById('place').textContent=[g.name,g.admin1,g.country].filter(Boolean).join(', ');document.getElementById('temp').textContent=Math.round(d.current.temperature_2m)+'°';document.getElementById('desc').textContent=(codes[d.current.weather_code]||'Current conditions')+' · feels like '+Math.round(d.current.apparent_temperature)+'°';document.getElementById('days').innerHTML=d.daily.time.map((day,i)=>'<div class="day"><b>'+new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})+'</b><span>'+(codes[d.daily.weather_code[i]]||'Forecast')+'</span><span>'+Math.round(d.daily.temperature_2m_max[i])+'° / '+Math.round(d.daily.temperature_2m_min[i])+'°</span></div>').join('');document.getElementById('result').hidden=false;localStorage.setItem('weathernow-city',q);statusEl.textContent='';}catch(err){statusEl.className='status error';statusEl.textContent=err.message||'Could not load weather.';}finally{button.disabled=false;}});if(input.value)form.requestSubmit();
</script></body></html>
